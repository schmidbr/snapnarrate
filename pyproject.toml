[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snapnarrate"
dynamic = ["version"]
description = "Read on-screen game text aloud with AI vision and ElevenLabs voices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "mss>=9.0",
  "Pillow>=10.4",
  "pystray>=0.19.5",
  "numpy>=2.0",
  "sounddevice>=0.5",
  "soundfile>=0.13",
  "customtkinter>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
snapnarrate = "snap_narrate.cli:main"

[project.gui-scripts]
snapnarrate-gui = "snap_narrate.cli:gui_main"

# Third-party addons register here; see docs/ADDONS.md.
# [project.entry-points."snapnarrate.addons"]
# my_addon = "my_package.addon:MyAddon"

[tool.setuptools.dynamic]
version = { attr = "snap_narrate.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
